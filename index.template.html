<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Польская грамматика — таблицы, правила и примеры</title>
<meta name="description" content="Справочник польской грамматики на русском: семь падежей, четыре спряжения, род, числительные и служебные слова - с опорой на русский и белорусский.">
<meta name="theme-color" content="#EFF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15181A" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="https://polski.hamanovich.com/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://polski.hamanovich.com/">
<meta property="og:locale" content="ru_RU">
<meta property="og:title" content="Польская грамматика — таблицы, правила и примеры">
<meta property="og:description" content="Девятнадцать разделов с таблицами окончаний, подводными камнями и поиском по всему тексту. Без регистрации и рекламы.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script>document.documentElement.classList.add("js")</script>
<script>try{var t=localStorage.getItem("theme");if(t&&t!=="auto")document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>

<header>
  <div class="head-in">
    <div class="brand">
      <h1>Polski: końców<span class="tail">ki</span></h1>
      <span>справочник · русско-белорусская опора</span>
      <div id="theme" class="themebar" role="group" aria-label="Тема оформления"></div>
      <div id="sbox">
        <input id="gsearch" type="search" autocomplete="off" spellcheck="false"
               placeholder="поиск по всему справочнику  /" aria-label="Поиск по справочнику"
               role="combobox" aria-expanded="false" aria-controls="sres" aria-autocomplete="list">
        <div id="sres" role="listbox" aria-label="Результаты поиска"></div>
      </div>
    </div>
    <div id="navwrap">
      <div id="navscroll">
        <button id="navl" class="navarr" aria-label="Прокрутить вкладки влево"><svg width="8" height="13" viewBox="0 0 8 13" aria-hidden="true"><path d="M7 1 2 6.5 7 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <nav id="nav" aria-label="Разделы справочника"></nav>
        <button id="navr" class="navarr" aria-label="Прокрутить вкладки вправо"><svg width="8" height="13" viewBox="0 0 8 13" aria-hidden="true"><path d="M1 1 6 6.5 1 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <button id="navall" type="button" aria-expanded="false" aria-controls="navmenu">все разделы</button>
      <div id="navmenu"></div>
    </div>
  </div>
</header>

<div class="wrap">
  <section id="s-index" class="sec on" role="tabpanel" tabindex="-1" aria-labelledby="tab-s-index"></section>
  <section id="s-alpha" class="sec" role="tabpanel" tabindex="-1" aria-labelledby="tab-s-alpha"></section>
  <section id="s-rodz" class="sec" role="tabpanel" tabindex="-1" aria-labelledby="tab-s-rodz"></section>
  <section id="s-cases" class="sec" role="tabpanel" tabindex="-1" aria-labelledby="tab-s-cases">
    <div class="casebar">
      <div class="chips" id="chips" role="group" aria-label="Падеж"></div>
      <div class="tog" id="numtog" role="group" aria-label="Число"></div>
    </div>
    <div class="panel" id="casePanel"></div>
  </section>
  <section id="s-alt" class="sec" role="tabpanel" tabindex="-1" aria-labelledby="tab-s-alt"></section>

  <section id="s-adj" class="sec" role="tabpanel" tabindex="-1" aria-labelledby="tab-s-adj"></section>
  <section id="s-adv" class="sec" role="tabpanel" tabindex="-1" aria-labelledby="tab-s-adv"></section>
  <section id="s-pron" class="sec" role="tabpanel" tabindex="-1" aria-labelledby="tab-s-pron"></section>
  <section id="s-q" class="sec" role="tabpanel" tabindex="-1" aria-labelledby="tab-s-q"></section>
  <section id="s-num" class="sec" role="tabpanel" tabindex="-1" aria-labelledby="tab-s-num"></section>
  <section id="s-verbs" class="sec" role="tabpanel" tabindex="-1" aria-labelledby="tab-s-verbs"></section>
  <section id="s-neg" class="sec" role="tabpanel" tabindex="-1" aria-labelledby="tab-s-neg"></section>
  <section id="s-order" class="sec" role="tabpanel" tabindex="-1" aria-labelledby="tab-s-order"></section>
  <section id="s-impers" class="sec" role="tabpanel" tabindex="-1" aria-labelledby="tab-s-impers"></section>
  <section id="s-conj" class="sec" role="tabpanel" tabindex="-1" aria-labelledby="tab-s-conj"></section>
  <section id="s-part" class="sec" role="tabpanel" tabindex="-1" aria-labelledby="tab-s-part"></section>
  <section id="s-ludzie" class="sec" role="tabpanel" tabindex="-1" aria-labelledby="tab-s-ludzie"></section>
  <section id="s-dim" class="sec" role="tabpanel" tabindex="-1" aria-labelledby="tab-s-dim"></section>
  <section id="s-preps" class="sec" role="tabpanel" tabindex="-1" aria-labelledby="tab-s-preps"></section>
  <section id="s-bridge" class="sec" role="tabpanel" tabindex="-1" aria-labelledby="tab-s-bridge"></section>

  <footer>Ударение - всегда предпоследний слог (кроме исключений во вкладке «Алфавит»).</footer>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
